[project]
name = "advaiapp1-final"
version = "0.1.0"
description = "Assignments for Advanced Artificial Intelligence Applications I."
readme = "README.md"
license = "CC-BY-SA-4.0"
authors = [
    { name = "darabsp", email = "51314762+darabsp@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.7",
    "numpy>=2.3.5",
    "torch>=2.9.1",
    "tqdm>=4.67.1",
]

[project.scripts]
advaiapp1-final = "advaiapp1_final:main"

[build-system]
requires = ["uv_build>=0.9.4,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
